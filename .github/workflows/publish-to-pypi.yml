name: Publish saturn-client to PyPI
on:
  push:
    tags:
      - '*'
permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish saturn-client to PyPI
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - name: Set up Python
      uses: actions/setup-python@0f07f7f756721ebd886c2462646a35f78a8bc4de # v1.2.4
      with:
        python-version: 3.12
    - name: Install build dependencies
      run: >-
        python -m
        pip install
        setuptools
        wheel
        --upgrade
        --user
    - name: Build a binary wheel and a source tarball
      run: >-
        python
        setup.py
        sdist
        bdist_wheel
    - name: Publish distribution to PyPI
      if: startsWith(github.event.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        # Password is set in GitHub UI to an API secret for pypi
        user: __token__
        password: ${{ secrets.pypi_password }}
