name: Publish saturn-client to PyPI
on:
  push:
    tags:
      - '*'
permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish saturn-client to PyPI
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@0f07f7f756721ebd886c2462646a35f78a8bc4de # v1.2.4
      with:
        python-version: 3.12
    - name: Install build dependencies
      run: >-
        python -m
        pip install
        setuptools
        wheel
        --upgrade
        --user
    - name: Build a binary wheel and a source tarball
      run: >-
        python
        setup.py
        sdist
        bdist_wheel
    - name: Publish distribution to PyPI
      if: startsWith(github.event.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@00ef3b81828a3fa69f3434842ce50ec3981351b0 # v1.3.0
      with:
        # Password is set in GitHub UI to an API secret for pypi
        user: __token__
        password: ${{ secrets.pypi_password }}
