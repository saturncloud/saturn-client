name: Linting and unit tests

# only run this workflow on new commits to main
# or PRs into main
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
    # Run every Monday morning at 11:00a UTC, 6:00a CST
    - cron: '0 11 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: linting
          - task: sdist
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.8
        if: matrix.task != 'todo-checks'
        uses: s-weigand/setup-conda@7e8fd4c763d3ccb2296fe2a06814d45b3e447dc7 # v1.2.4
        with:
          python-version: 3.8
      - name: linting
        if: matrix.task == 'linting'
        shell: bash
        run: |
          pip install --upgrade black flake8 pylint
          make lint
      - name: test source distribution
        if: matrix.task == 'sdist'
        shell: bash
        run: |
          python setup.py sdist
          pip install dist/saturn-client*.tar.gz
          python -c "from saturn_client import SaturnConnection"
